info:
  name: Update Product
  type: http
  seq: 4

http:
  method: PUT
  url: "{{host}}/product/2"
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const { faker } = require('@faker-js/faker');

        req.setBody({
          id: 2,
          name: faker.commerce.productName(),
          description: faker.lorem.paragraph(),
          price: Number(faker.commerce.price()),
          pictureUrl: faker.image.url(),
          type: "Some type",
          brand: "Some brand",
          quantityInStock: faker.number.int({ min: 1, max: 500 })
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
