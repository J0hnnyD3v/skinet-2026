info:
  name: Get Products sort by price or default
  type: http
  seq: 10

http:
  method: GET
  url: "{{host}}/product?type=boards"
  params:
    - name: type
      value: boards
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
