info:
  name: Get all products
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/product?pageSize=300"
  params:
    - name: pageSize
      value: "300"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
