info:
  name: Get Cart
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/cart?key={{cartKey}}"
  params:
    - name: key
      value: "{{cartKey}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
